name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: .NET 10 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Test Windows installer with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/Install.Tests.ps1

      - name: Test Windows installer with PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/Install.Tests.ps1
