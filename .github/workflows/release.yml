name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, archive: tar }
          - { os: ubuntu-latest, rid: linux-arm64, archive: tar }
          - { os: macos-latest, rid: osx-x64, archive: tar }
          - { os: macos-latest, rid: osx-arm64, archive: tar }
          - { os: windows-latest, rid: win-x64, archive: zip }
          - { os: windows-latest, rid: win-arm64, archive: zip }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Lag/Lag.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Create tar archive
        if: matrix.archive == 'tar'
        shell: bash
        run: tar -C publish -czf lag-${{ matrix.rid }}.tar.gz lag

      - name: Create zip archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path publish/lag.exe -DestinationPath lag-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: lag-${{ matrix.rid }}
          path: lag-${{ matrix.rid }}.*

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lag-*
          merge-multiple: true
          path: dist

      - name: Create checksums
        working-directory: dist
        run: sha256sum lag-* > checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
